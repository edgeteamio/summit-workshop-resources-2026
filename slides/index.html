<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>AiEdge Summit 2026 · Slides</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #000; color: #f5f5f7; font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }

    /* Deck list (no ?deck=) */
    .home { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
    .home h1 { font-size: 28px; margin: 0 0 8px; }
    .home p { color: #a1a1aa; margin: 0 0 24px; }
    .home a.deck { display: block; padding: 20px 24px; margin-bottom: 12px; border: 1px solid #3f3f46; border-radius: 14px; color: inherit; text-decoration: none; background: #18181b; }
    .home a.deck:hover { border-color: #71717a; }
    .home a.deck strong { display: block; font-size: 18px; }
    .home a.deck span { color: #a1a1aa; font-size: 14px; }
    .home kbd, .help kbd { font: 12px/1 ui-monospace, monospace; padding: 2px 6px; border: 1px solid #52525b; border-radius: 4px; }

    /* Presenter: a 1920x1080 stage scaled to fit the window */
    .viewport { position: fixed; inset: 0; overflow: hidden; cursor: default; }
    .stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; }
    .stage > section { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity 350ms ease, visibility 0s linear 350ms; }
    .stage > section.is-current { opacity: 1; visibility: visible; transition: opacity 350ms ease; }

    /* What the Slides artifact runtime provides for slide markup */
    .slide-base, .slide-base * , .slide-base *::before, .slide-base *::after { box-sizing: border-box; }
    .slide-base { width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, Arial, sans-serif; }
    .slide-base :where(h1, h2, h3, h4, h5, h6, p, figure, blockquote, ul, ol) { margin: 0; }
    .slide-base aside { display: none; }
    .slide-base table { width: 100%; border-collapse: collapse; }
    .slide-base :where(th, td) { padding: 8px 20px; text-align: left; vertical-align: middle; }
    .slide-base :where(th) { font-weight: 700; }
    .slide-base x-shape { display: block; flex: none; }
    .slide-base x-shape[kind="arrow-right"] { clip-path: polygon(0 30%, 62% 30%, 62% 0, 100% 50%, 62% 100%, 62% 70%, 0 70%); }
    .slide-base x-icon { display: inline-block; flex: none; }
    .slide-base x-icon svg { display: block; width: 100%; height: 100%; }

    /* Builds: data-build-in="pop 1" | "fade 2" | "rise 3" appear on clicks */
    [data-build-in].build-pending { opacity: 0 !important; }
    [data-build-in] { transition: opacity 300ms ease, translate 400ms cubic-bezier(.2,.7,.3,1), scale 400ms cubic-bezier(.2,.7,.3,1.4); }
    [data-build-in^="pop"].build-pending { scale: 0.6; }
    [data-build-in^="rise"].build-pending { translate: 0 40px; }

    /* Notes (N), grid (G), help (?) */
    .notes { position: fixed; left: 0; right: 0; bottom: 0; max-height: 42vh; overflow: auto; padding: 16px 180px 20px 24px; background: rgba(9, 9, 11, 0.94); border-top: 1px solid #3f3f46; font-size: 17px; line-height: 1.5; white-space: pre-wrap; display: none; }
    .notes.is-open { display: block; }
    .notes .meta { color: #a1a1aa; font-size: 13px; margin-bottom: 6px; white-space: normal; }
    .grid { position: fixed; inset: 0; overflow: auto; padding: 24px; background: #09090b; display: none; }
    .grid.is-open { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; align-content: start; }
    .thumb { cursor: pointer; }
    .thumb__frame { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 8px; outline: 2px solid transparent; background: #18181b; }
    .thumb:hover .thumb__frame { outline-color: #71717a; }
    .thumb.is-current .thumb__frame { outline-color: #22d3ee; }
    .thumb__frame > section { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
    .thumb__label { display: flex; gap: 8px; margin-top: 6px; font-size: 13px; color: #a1a1aa; }
    .thumb__label code { color: #e4e4e7; }
    .thumb.is-hidden { opacity: 0.45; }
    .section-label { grid-column: 1 / -1; margin: 12px 0 -8px; color: #a1a1aa; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; }
    .help { position: fixed; right: 16px; top: 16px; padding: 14px 18px; border-radius: 10px; background: rgba(9, 9, 11, 0.92); border: 1px solid #3f3f46; font-size: 14px; display: none; }
    .help.is-open { display: block; }
    .help div { margin: 3px 0; }
    /* On-screen controls (‹ › all slides) for anyone who doesn't know the keys. Faint until hovered or focused.
       A row in the bottom-right corner; a column when the window is clearly wider than 16:9, so on a landscape
       phone they sit in the side bar instead of on the slide. The arrows hide while the grid is open.
       .notes keeps 180px of right padding so note text never runs under them. */
    .controls { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; }
    .controls button { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 10px; background: rgba(9, 9, 11, 0.6); color: #f5f5f7; cursor: pointer; opacity: 0.35; transition: opacity 150ms ease; touch-action: manipulation; }
    .controls button:hover, .controls button:focus-visible, .grid-button[aria-expanded="true"] { opacity: 1; }
    .controls button:focus-visible { outline: 2px solid #22d3ee; outline-offset: 2px; }
    .grid-button[aria-expanded="true"] { border-color: #22d3ee; color: #22d3ee; }
    .controls svg { width: 20px; height: 20px; }
    .grid.is-open ~ .controls .nav-button { display: none; }
    @media (min-aspect-ratio: 17/9) { .controls { flex-direction: column; } }
    @media (hover: none) { .controls button { opacity: 0.6; } }
    .error { max-width: 720px; margin: 48px auto; padding: 0 24px; }
    .error code { background: #27272a; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="icons.js"></script>
  <script>
    // Presents the decks in this folder. Each deck is a folder with deck.json (title, order,
    // sections, faces) and one HTML file per slide, in the Slides artifact format: a single
    // <section> on a 1920x1080 canvas, with speaker notes in <aside>. See README.md.
    const app = document.getElementById('app');
    const params = new URLSearchParams(location.search);
    const deckId = params.get('deck');

    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      node.append(...children);
      return node;
    }

    async function getText(url) {
      const res = await fetch(url, { cache: 'no-cache' });
      if (!res.ok) throw new Error(url + ' → HTTP ' + res.status);
      return res.text();
    }

    function showError(err) {
      app.replaceChildren(el('div', { class: 'error' },
        el('h1', {}, 'Could not load the slides'),
        el('p', {}, String(err.message || err)),
        el('p', {}, 'Open this page through a web server, not as a file: from the repo root run ',
          el('code', {}, 'python3 -m http.server 8000'), ' and go to ',
          el('code', {}, 'http://localhost:8000/slides/'), '.')));
    }

    async function home() {
      const decks = JSON.parse(await getText('decks.json'));
      app.replaceChildren(el('main', { class: 'home' },
        el('h1', {}, 'The Second Brain Stack'),
        el('p', {}, 'Pick a deck. In a deck: arrow keys or click to move, N notes, G all slides, F full screen, ? keys.'),
        ...decks.map((d) => {
          const a = el('a', { class: 'deck', href: '?deck=' + encodeURIComponent(d.id) }, el('strong', {}, d.title), el('span', {}, d.when || ''));
          return a;
        })));
    }

    // The artifact runtime draws <x-icon>; here they become inline Lucide SVGs (icons.js).
    function drawIcons(root) {
      for (const icon of root.querySelectorAll('x-icon')) {
        const body = (window.SLIDE_ICONS || {})[icon.getAttribute('name')];
        if (!body || icon.querySelector('svg')) continue;
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
      }
    }

    function buildSteps(section) {
      const steps = new Map();
      for (const node of section.querySelectorAll('[data-build-in]')) {
        // "pop 1", "fade 2", "fade order 3": the trailing number is the click it appears on.
        const step = Number((String(node.getAttribute('data-build-in')).match(/(\d+)\s*$/) || [])[1]) || 1;
        if (!steps.has(step)) steps.set(step, []);
        steps.get(step).push(node);
      }
      return [...steps.keys()].sort((a, b) => a - b).map((k) => steps.get(k));
    }

    async function present(id) {
      const base = encodeURIComponent(id) + '/';
      const deck = JSON.parse(await getText(base + 'deck.json'));
      document.title = deck.title + ' · Slides';
      for (const face of Object.values(deck.faces || {})) {
        if (face.href) document.head.append(el('link', { rel: 'stylesheet', href: face.href }));
      }

      const htmls = await Promise.all(deck.order.map((slideId) => getText(base + slideId + '.html')));
      const sections = htmls.map((html, i) => {
        const tpl = document.createElement('template');
        tpl.innerHTML = html.trim();
        const section = tpl.content.querySelector('section');
        if (!section) throw new Error(deck.order[i] + '.html has no <section>');
        // Image paths in slide files are relative to this folder (assets/...).
        section.classList.add('slide-base');
        drawIcons(section);
        return section;
      });

      const viewport = el('div', { class: 'viewport' });
      const stage = el('div', { class: 'stage' }, ...sections);
      viewport.append(stage);
      const notes = el('div', { class: 'notes' });
      const grid = el('div', { class: 'grid' });
      const help = el('div', { class: 'help' },
        ...[['→ / Space / click', 'next'], ['←', 'back'], ['N', 'speaker notes'], ['G', 'all slides (or the button, bottom right)'], ['F', 'full screen'], ['Home / End', 'first / last'], ['Esc', 'close panels']]
          .map(([k, v]) => el('div', {}, el('kbd', {}, k), ' ' + v)));
      // On-screen controls: outside the viewport (its clicks would change slides) and the stage (the grid clones it);
      // last, so they sit above the grid. Icons are Lucide chevron-left, chevron-right and layout-grid.
      function controlButton(attrs, icon) {
        const button = el('button', { type: 'button', ...attrs });
        button.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + icon + '</svg>';
        return button;
      }
      const prevButton = controlButton({ class: 'nav-button', 'aria-label': 'Previous slide', title: 'Previous (←)' }, '<path d="m15 18-6-6 6-6" />');
      const nextButton = controlButton({ class: 'nav-button', 'aria-label': 'Next slide', title: 'Next (→)' }, '<path d="m9 18 6-6-6-6" />');
      const gridButton = controlButton({ class: 'grid-button', 'aria-label': 'All slides', 'aria-expanded': 'false', title: 'All slides (G)' },
        '<rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" />');
      const controls = el('div', { class: 'controls', role: 'group', 'aria-label': 'Slide controls' }, prevButton, nextButton, gridButton);
      app.replaceChildren(viewport, notes, grid, help, controls);

      const visible = sections.map((s, i) => i).filter((i) => !sections[i].hasAttribute('hidden'));
      let index = 0; // index into sections
      let step = 0;  // builds shown on the current slide
      let steps = [];

      function fit() {
        const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
        stage.style.transform = 'scale(' + scale + ') translate(-50%, -50%)';
      }

      function applyBuilds() {
        steps.forEach((group, i) => group.forEach((node) => node.classList.toggle('build-pending', i >= step)));
      }

      function go(target, { atEnd = false } = {}) {
        index = Math.max(0, Math.min(sections.length - 1, target));
        sections.forEach((s, i) => s.classList.toggle('is-current', i === index));
        steps = buildSteps(sections[index]);
        step = atEnd ? steps.length : 0;
        applyBuilds();
        const section = sections[index];
        const aside = section.querySelector('aside');
        const position = visible.indexOf(index);
        notes.replaceChildren(
          el('div', { class: 'meta' }, (position + 1) + ' / ' + visible.length + ' · ' + section.id + '.html' + (section.hasAttribute('hidden') ? ' · hidden' : '')),
          aside ? aside.textContent.trim() : '(no notes)');
        history.replaceState(null, '', '#' + section.id);
        for (const t of grid.querySelectorAll('.thumb')) t.classList.toggle('is-current', t.dataset.index === String(index));
      }

      function next() {
        if (step < steps.length) { step += 1; applyBuilds(); return; }
        const later = visible.find((i) => i > index);
        if (later !== undefined) go(later);
      }

      function prev() {
        if (step > 0) { step -= 1; applyBuilds(); return; }
        const earlier = [...visible].reverse().find((i) => i < index);
        if (earlier !== undefined) go(earlier, { atEnd: true });
      }

      function buildGrid() {
        const items = [];
        const starts = new Map(Object.values(deck.sections || {}).map((s) => [s.start, s.description]));
        sections.forEach((section, i) => {
          if (starts.has(section.id)) items.push(el('div', { class: 'section-label' }, starts.get(section.id)));
          const clone = section.cloneNode(true);
          clone.classList.remove('is-current');
          clone.removeAttribute('hidden');
          for (const node of clone.querySelectorAll('.build-pending')) node.classList.remove('build-pending');
          const frame = el('div', { class: 'thumb__frame' }, clone);
          const thumb = el('div', { class: 'thumb' + (section.hasAttribute('hidden') ? ' is-hidden' : '') }, frame,
            el('div', { class: 'thumb__label' }, el('span', {}, String(i + 1)), el('code', {}, section.id + '.html'), section.hasAttribute('hidden') ? el('span', {}, 'hidden') : ''));
          thumb.dataset.index = String(i);
          thumb.addEventListener('click', () => { go(i); toggleGrid(false); });
          items.push(thumb);
        });
        grid.replaceChildren(...items);
        sizeThumbs();
      }

      function sizeThumbs() {
        for (const frame of grid.querySelectorAll('.thumb__frame')) {
          const scale = frame.clientWidth / 1920;
          if (scale) frame.firstChild.style.transform = 'scale(' + scale + ')';
        }
      }

      // G, the Slides button, thumbnails and Esc all open or close the grid here; no argument toggles.
      function toggleGrid(open) {
        grid.classList.toggle('is-open', open);
        gridButton.setAttribute('aria-expanded', String(grid.classList.contains('is-open')));
        sizeThumbs();
      }

      addEventListener('resize', () => { fit(); sizeThumbs(); });
      addEventListener('hashchange', () => {
        const target = sections.findIndex((s) => '#' + s.id === location.hash);
        if (target >= 0 && target !== index) go(target);
      });
      addEventListener('keydown', (event) => {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        const key = event.key;
        if (grid.classList.contains('is-open') && !['g', 'G', 'Escape'].includes(key)) return;
        if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].includes(key)) { event.preventDefault(); next(); }
        else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(key)) { event.preventDefault(); prev(); }
        else if (key === 'Home') go(visible[0]);
        else if (key === 'End') go(visible[visible.length - 1], { atEnd: true });
        else if (key === 'n' || key === 'N') notes.classList.toggle('is-open');
        else if (key === 'g' || key === 'G') toggleGrid();
        else if (key === 'f' || key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
        else if (key === '?') help.classList.toggle('is-open');
        else if (key === 'Escape') { toggleGrid(false); help.classList.remove('is-open'); notes.classList.remove('is-open'); }
      });
      viewport.addEventListener('click', (event) => {
        // Left fifth of the screen goes back; anywhere else goes forward.
        if (event.clientX < innerWidth / 5) prev(); else next();
      });
      // Same prev(), next() and toggleGrid() as the keys, so builds step exactly like the arrows.
      for (const [button, action] of [[prevButton, prev], [nextButton, next], [gridButton, () => toggleGrid()]]) {
        button.addEventListener('click', (event) => {
          action();
          // After a mouse click, drop focus so the next Space advances instead of pressing the button again.
          if (event.detail) button.blur();
        });
      }
      // Enter and Space press the focused button; keep the window handler from also reading them as "next".
      controls.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') event.stopPropagation(); });

      fit();
      buildGrid();
      const fromHash = sections.findIndex((s) => '#' + s.id === location.hash);
      go(fromHash >= 0 ? fromHash : visible[0]);
      if (params.get('view') === 'grid') toggleGrid(true);
    }

    (deckId ? present(deckId) : home()).catch(showError);
  </script>
</body>
</html>
